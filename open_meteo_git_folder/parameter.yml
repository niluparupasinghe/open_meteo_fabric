# fabric-cicd parameter file. Lives in the root of the repository_directory.
# Replaces Dev-specific ids with the ids of the workspace being deployed to.
# Environment keys (TEST, PROD) must match FABRIC_ENVIRONMENT in the deploy workflow.

find_replace:
    # Dev workspace id hardcoded in the notebook metadata -> target workspace id
    - find_value: "9f3e961b-8055-4ad0-a1c2-bd98cd12e3d9"
      replace_value:
          TEST: "$workspace.$id"
          PROD: "$workspace.$id"
      item_type: "Notebook"

